name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Tests (offline)
        run: pytest
      - name: Citation metadata is valid
        run: cffconvert --validate
      - name: JavaScript parses
        run: |
          mkdir -p /tmp/js
          for f in web/js/*.js; do cp "$f" "/tmp/js/$(basename "$f" .js).mjs"; done
          for f in /tmp/js/*.mjs; do node --check "$f"; done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the server image
        run: docker build -t skyshift .
      - name: Server starts and answers
        run: |
          docker run -d --name skyshift -p 7860:7860 -e SKYSHIFT_PRECACHE=0 skyshift
          for i in $(seq 30); do curl -fs http://localhost:7860/api/health && break; sleep 2; done
          curl -fs http://localhost:7860/api/health | grep '"status":"ok"'
          curl -fs http://localhost:7860/ | grep -q SkyShift
      - name: Server log
        if: always()
        run: docker logs skyshift
